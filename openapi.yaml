openapi: 3.0.3
info:
  title: Lume — API de cosméticos e autocuidado
  version: 1.0.0
  description: >-
    API demonstrativa com MongoDB em memória. Valores monetários são inteiros em centavos.
    Dinheiro dá 10% de desconto nos produtos. Frete custa 2000 centavos, exceto para VIP.
    VIP é concedido ao acumular 30000 centavos pagos em produtos, com benefícios na próxima compra.
    Pagamentos são simulados. Reiniciar a API restaura os dados iniciais e invalida sessões.
servers:
  - url: /api
tags:
  - name: Autenticação
  - name: Produtos
  - name: Carrinho
  - name: Compra
  - name: Documentação
paths:
  /health:
    get:
      tags: [Documentação]
      summary: Verificar disponibilidade
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastrar cliente e iniciar sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - type: object
                  required: [name]
                  properties:
                    name:
                      {
                        type: string,
                        minLength: 2,
                        maxLength: 80,
                        example: Maria Souza,
                      }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Entrar com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me:
    get:
      tags: [Autenticação]
      summary: Consultar perfil e situação VIP
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Perfil autenticado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /products:
    get:
      tags: [Produtos]
      summary: Listar os três produtos da vitrine
      responses:
        "200":
          description: Catálogo e estoque atual
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /cart:
    get:
      tags: [Carrinho]
      summary: Consultar carrinho e simular totais
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: payment
          schema: { type: string, enum: [cash, card], default: card }
      responses:
        "200":
          description: Totais calculados no servidor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /cart/items:
    put:
      tags: [Carrinho]
      summary: Adicionar produto ou definir sua quantidade absoluta
      description: Não reserva estoque. A quantidade substitui a existente, com limite de 99 unidades por produto.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  {
                    type: string,
                    pattern: "^[a-fA-F0-9]{24}$",
                    description: ID obtido em GET /products,
                  }
                quantity: { type: integer, minimum: 1, maximum: 99, example: 1 }
      responses:
        "200":
          description: Carrinho atualizado, com totais para cartão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /cart/items/{id}:
    delete:
      tags: [Carrinho]
      summary: Remover produto do carrinho
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Carrinho atualizado, com totais para cartão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /checkout:
    post:
      tags: [Compra]
      summary: Finalizar compra simulada
      description: >-
        Recalcula os valores, valida e baixa estoque, registra pedido, atualiza o acumulado VIP
        e esvazia o carrinho em uma transação. A mesma chave retorna o pedido original,
        sem repetir a compra. Use uma nova chave para uma nova compra.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment, address]
              properties:
                payment: { type: string, enum: [cash, card] }
                address: { $ref: "#/components/schemas/Address" }
            example:
              payment: cash
              address:
                recipient: Ana Silva
                street: Rua das Flores, 123
                city: São Paulo
                state: SP
                zip: "01001-000"
      responses:
        "201":
          description: Pedido confirmado ou recuperado pela chave
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /openapi.yaml:
    get:
      tags: [Documentação]
      summary: Obter esta especificação YAML
      responses:
        "200":
          description: Especificação OpenAPI 3.0.3
          content:
            application/yaml:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          { type: string, format: email, maxLength: 254, example: ana@lume.com }
        password:
          { type: string, minLength: 8, maxLength: 72, example: "Lume@123" }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Ana Silva }
        email: { type: string, example: ana@lume.com }
        spent:
          {
            type: integer,
            example: 0,
            description: Acumulado em centavos,
            após descontos e sem frete,
          }
        vip: { type: boolean, example: false }
    Product:
      type: object
      properties:
        _id: { type: string }
        name: { type: string, example: Sérum Ilumina }
        category: { type: string, example: ROSTO }
        description: { type: string }
        price: { type: integer, example: 8990 }
        stock: { type: integer, example: 20 }
        kind: { type: string, enum: [serum, cream, sun] }
        volume: { type: string, example: 30 ml }
    Item:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        price: { type: integer, example: 8990 }
        stock: { type: integer, example: 20 }
        quantity: { type: integer, example: 1 }
        kind: { type: string }
    Cart:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        subtotal: { type: integer, example: 8990 }
        discount: { type: integer, example: 899 }
        shipping: { type: integer, example: 2000 }
        total: { type: integer, example: 10091 }
    Address:
      type: object
      required: [recipient, street, city, state, zip]
      properties:
        recipient: { type: string, minLength: 2, maxLength: 80 }
        street: { type: string, minLength: 3, maxLength: 160 }
        city: { type: string, minLength: 2, maxLength: 80 }
        state: { type: string, pattern: "^[A-Z]{2}$" }
        zip: { type: string, pattern: '^\d{5}-?\d{3}$' }
    Order:
      allOf:
        - $ref: "#/components/schemas/Cart"
        - type: object
          properties:
            _id: { type: string }
            userId: { type: string }
            key: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            payment: { type: string, enum: [cash, card] }
            address: { $ref: "#/components/schemas/Address" }
    Error:
      type: object
      properties:
        message: { type: string, example: Confira os campos informados. }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    Session:
      description: Sessão iniciada; token válido por duas horas
      content:
        application/json:
          schema:
            type: object
            properties:
              token: { type: string }
              user: { $ref: "#/components/schemas/User" }
    BadRequest:
      description: Dados inválidos ou carrinho vazio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Credenciais inválidas, token ausente ou expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Estoque insuficiente, e-mail duplicado ou conflito de registro
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Limite de 50 tentativas de autenticação por IP em 15 minutos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
