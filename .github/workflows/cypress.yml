name: Testes de API e UI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Cypress ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # A falha de uma camada não cancela a coleta de resultados da outra.
      fail-fast: false
      matrix:
        suite: [api, ui]
    env:
      CYPRESS_BASE_URL: http://127.0.0.1:5173
      CYPRESS_API_URL: http://127.0.0.1:3000
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar e verificar Cypress
        run: |
          npx cypress install
          npx cypress verify

      # Baixa o MongoDB antes do timeout de inicialização do ambiente Cypress.
      # O replica set temporário é encerrado; cada suíte cria sua própria massa.
      - name: Preparar binário MongoDB
        run: |
          node --input-type=module <<'NODE'
          import { MongoMemoryReplSet } from 'mongodb-memory-server';
          const db = await MongoMemoryReplSet.create({ replSet: { count: 1, storageEngine: 'wiredTiger' } });
          await db.stop();
          NODE

      # A configuração Cypress inicia e encerra API/Vite; não iniciar npm run dev.
      - name: Executar testes de ${{ matrix.suite }}
        run: xvfb-run -a npm run test:${{ matrix.suite }} -- --browser chrome

      - name: Preservar resultados e screenshots
        id: resultados
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cypress/results/
            cypress/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Informar publicação do relatório
        if: always()
        run: |
          echo 'Na branch padrão, o job **Publicar relatórios no navegador** disponibiliza o link após o término das duas suítes. Pull requests e outras branches preservam apenas os artefatos.' >> "$GITHUB_STEP_SUMMARY"

  reports:
    name: Publicar relatórios no navegador
    needs: cypress
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reunir resultados de API e UI
        uses: actions/download-artifact@v5
        with:
          pattern: cypress-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports-input

      - name: Preparar página dos relatórios
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p public
          touch public/.nojekyll
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Lume — Relatórios de testes</title>
          <style>body{font:18px system-ui;max-width:800px;margin:60px auto;padding:24px;line-height:1.6}a{color:#2455ad}li{margin:16px 0}</style>
          <h1>Relatórios de testes — Lume</h1>
          <p>Última execução publicada da branch padrão. Selecione uma suíte para abrir o Mochawesome.</p>
          HTML
          echo "<p>Execução ${RUN_ID}, tentativa ${RUN_ATTEMPT}.</p><ul>" >> public/index.html
          for suite in api ui; do
            report="reports-input/cypress-${suite}-${RUN_ID}-${RUN_ATTEMPT}/results/mochawesome/index.html"
            if [ -f "$report" ]; then
              mkdir -p "public/${suite}"
              cp "$report" "public/${suite}/index.html"
              echo "<li><a href=\"${suite}/\">Abrir relatório de ${suite^^}</a></li>" >> public/index.html
            else
              echo "<li>Relatório de ${suite^^} indisponível nesta execução. Consulte os logs do Actions.</li>" >> public/index.html
            fi
          done
          echo '</ul></html>' >> public/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Exibir link para abrir no navegador
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### Relatórios Mochawesome" >> "$GITHUB_STEP_SUMMARY"
          echo "[Abrir relatórios no navegador](${PAGE_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo 'O endereço mostra a última execução publicada da branch padrão.' >> "$GITHUB_STEP_SUMMARY"
